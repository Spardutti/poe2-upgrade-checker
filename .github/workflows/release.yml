name: Release

# Builds the Windows installer and the portable .exe (and, after them, the experimental Linux
# AppImage), runs the tests, and publishes them as a GitHub release with the matching CHANGELOG.md section as release notes.
# Started by release.bat (it pushes a tag like v0.4.1), or by hand: Actions -> Release -> Run workflow.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ "v$VER" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} but package.json says $VER"; exit 1; fi
      - run: npm install --no-audit --no-fund
      - run: node tools/get-pob.js
      - run: node tools/pob-smoke.js
      - run: npm test
      - name: Build and upload the installer and portable .exe
        run: npx electron-builder@25.1.8 --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release notes from CHANGELOG.md
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          node -e '
            const fs = require("fs"); const v = process.argv[1];
            const log = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8") : "";
            const lines = log.split(/\r?\n/); let out = []; let on = false;
            for (const l of lines) {
              if (/^## /.test(l)) { if (on) break; on = l.slice(3).trim() === v || l.slice(3).startsWith(v + " "); continue; }
              if (on) out.push(l);
            }
            const notes = out.join("\n").trim() || "Fixes and improvements.";
            const head = "## Download\n\n- **`PoE2-Upgrade-Checker-Setup-" + v + ".exe`**: installs for your user (no admin) and **updates itself**. Recommended.\n- `PoE2-Upgrade-Checker-Portable-" + v + ".exe`: no install, no auto-update.\n\nWindows may say the app is unrecognised (it isn\x27t code-signed): click *More info → Run anyway*. In PoE2, use **Windowed Fullscreen**.\n\n**Linux (experimental):** `PoE2-Upgrade-Checker.AppImage` for the game under Steam/Proton. `chmod +x` it and run it; it updates itself in place. See the README\x27s Linux section.\n\n## What\x27s new\n\n";
            fs.writeFileSync("notes.md", head + notes + "\n\nFull guide: [README](https://github.com/" + process.env.GITHUB_REPOSITORY + "#readme)\n");
          ' "$VER"
          gh release edit "v$VER" --title "$VER" --notes-file notes.md

  # Linux AppImage (experimental): built on the oldest supported Ubuntu so it runs on older distros
  # too, after the Windows job has created the release; uploaded with its auto-update file.
  linux:
    needs: build
    runs-on: ubuntu-22.04
    continue-on-error: true # experimental: a Linux problem never fails the Windows release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node tools/get-pob.js
      - run: node tools/pob-smoke.js
      - run: npm test
      - name: Build the AppImage
        run: npx electron-builder@25.1.8 --linux AppImage --publish never
      - name: Upload it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          ls -la dist
          gh release upload "v$VER" dist/*.AppImage dist/latest-linux.yml --clobber
